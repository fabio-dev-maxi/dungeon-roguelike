<svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  @switch (name()) {
  @case ('sword') {
  <line x1="18.5" y1="3.5" x2="7" y2="15" />
  <line x1="9.2" y1="10.6" x2="12" y2="13.4" />
  <line x1="7" y1="15" x2="5" y2="19" />
  <circle cx="5" cy="19.4" r="1" fill="currentColor" stroke="none" />
  }
  @case ('swords') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 17.5L3 6V3h3l11.5 11.5m-3-11.5L21 3v3l-11.5 11.5M4 17l3 3M17 4l3 3M3 21l3-3m12 3l-3-3" />
  </svg>
  }
  @case ('dagger') {
  <line x1="7" y1="7" x2="17" y2="17" />
  <line x1="17" y1="7" x2="7" y2="17" />
  <line x1="9.5" y1="9.5" x2="8.3" y2="10.7" />
  <line x1="14.5" y1="9.5" x2="15.7" y2="10.7" />
  }
  @case ('staff') {
  <line x1="12" y1="4.6" x2="12" y2="21" />
  <circle cx="12" cy="4.2" r="2.2" />
  }
  @case ('sun') {
  <circle cx="12" cy="12" r="5" />
  <line x1="20" y1="12" x2="22.5" y2="12" />
  <line x1="17.66" y1="17.66" x2="19.42" y2="19.42" />
  <line x1="12" y1="20" x2="12" y2="22.5" />
  <line x1="6.34" y1="17.66" x2="4.58" y2="19.42" />
  <line x1="4" y1="12" x2="1.5" y2="12" />
  <line x1="6.34" y1="6.34" x2="4.58" y2="4.58" />
  <line x1="12" y1="4" x2="12" y2="1.5" />
  <line x1="17.66" y1="6.34" x2="19.42" y2="4.58" />
  }
  @case ('shield') {
  <polygon points="12,2 20,5 20,12 12,22 4,12 4,5" /> }
  @case ('heart') {
  <circle cx="8" cy="9" r="4.5" />
  <circle cx="16" cy="9" r="4.5" />
  <polygon points="3.7,10.5 20.3,10.5 12,21" />
  }
  @case ('coin') {
  <circle cx="12" cy="12" r="8" />
  <circle cx="12" cy="12" r="3.6" />
  }
  @case ('star') {
  <polygon
    points="12,3 14.12,9.09 20.56,9.22 15.42,13.11 17.29,19.28 12,15.6 6.71,19.28 8.58,13.11 3.44,9.22 9.88,9.09" /> }
  @case ('flask') {
  <line x1="10" y1="2" x2="10" y2="7" />
  <line x1="14" y1="2" x2="14" y2="7" />
  <line x1="10" y1="2" x2="14" y2="2" />
  <polygon points="10,7 14,7 19,21 5,21" />
  <line x1="6.6" y1="17" x2="17.4" y2="17" />
  }
  @case ('gem') {
  <polygon points="12,2 19,9 12,22 5,9" />
  <line x1="5" y1="9" x2="19" y2="9" />
  <line x1="12" y1="2" x2="9" y2="9" />
  <line x1="12" y1="2" x2="15" y2="9" />
  }
  @case ('scroll') {
  <rect x="4" y="5" width="16" height="14" rx="2" />
  <line x1="7" y1="10" x2="17" y2="10" />
  <line x1="7" y1="14" x2="14" y2="14" />
  }
  @case ('skull') {
  <circle cx="12" cy="10" r="7" />
  <circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none" />
  <circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none" />
  <line x1="8" y1="16" x2="16" y2="16" />
  <line x1="9" y1="16" x2="9" y2="18.5" />
  <line x1="12" y1="16.5" x2="12" y2="19.5" />
  <line x1="15" y1="16" x2="15" y2="18.5" />
  }
  @case ('boot') {
  <polygon points="6,3 10,3 10,13 16,13 18,17 18,20 4,20 4,13 6,13" /> }
  @case ('stairs') {
  <polyline points="4,6 4,10 9,10 9,14 14,14 14,18 19,18" />
  <polyline points="15.5,18 19,18 19,14.5" />
  }
  @case ('layers') {
  <polyline points="4,7 12,10.2 20,7" />
  <polyline points="4,12 12,15.2 20,12" />
  <polyline points="4,17 12,20.2 20,17" />
  }
  @case ('book') {
  <rect x="4" y="4" width="16" height="16" rx="1.4" />
  <line x1="12" y1="4" x2="12" y2="20" />
  <line x1="6.5" y1="8" x2="10" y2="8" />
  <line x1="14" y1="8" x2="17.5" y2="8" />
  }
  @case ('eye') {
  <path d="M2.5 12C5 7.5 8.3 5.3 12 5.3S19 7.5 21.5 12C19 16.5 15.7 18.7 12 18.7S5 16.5 2.5 12Z" />
  <circle cx="12" cy="12" r="2.6" />
  }
  @case ('fist') {
  <rect x="6" y="9.5" width="12" height="9" rx="3.2" />
  <line x1="9" y1="6.5" x2="9" y2="9.5" />
  <line x1="12" y1="5.5" x2="12" y2="9.5" />
  <line x1="15" y1="6.5" x2="15" y2="9.5" />
  }
  @case ('feather') {
  <line x1="5" y1="19.5" x2="19" y2="5.5" />
  <line x1="8.2" y1="16.3" x2="11.2" y2="15.1" />
  <line x1="11.4" y1="13.1" x2="14.4" y2="11.9" />
  <line x1="14.6" y1="9.9" x2="17.6" y2="8.7" />
  }
  @case ('backpack') {
  <rect x="9" y="3.5" width="6" height="5" rx="1.3" />
  <rect x="6" y="8" width="12" height="12.5" rx="2.4" />
  <line x1="9" y1="12.5" x2="15" y2="12.5" />
  }
  @case ('key') {
  <circle cx="7.2" cy="7.2" r="3.9" />
  <line x1="10" y1="10" x2="19.5" y2="19.5" />
  <line x1="16.2" y1="15.7" x2="18.4" y2="13.5" />
  <line x1="18.3" y1="17.8" x2="20.4" y2="15.7" />
  }
  @case ('hammer') {
  <line x1="6" y1="19" x2="13.3" y2="11.7" />
  <rect x="12.2" y="4.6" width="7.6" height="5" rx="1" transform="rotate(45 16 7.1)" />
  }
  @case ('cup') {
  <polygon points="6,8 16,8 15,20 7,20" />
  <rect x="16" y="10" width="4" height="6.4" rx="2" />
  }
  @case ('crown') {
  <polyline points="4,18 4,9 8.3,13 12,6 15.7,13 20,9 20,18" />
  <line x1="4" y1="18" x2="20" y2="18" />
  }
  @case ('arrow-right') {
  <line x1="4" y1="12" x2="18" y2="12" />
  <polyline points="13,7 18,12 13,17" />
  }
  @case ('globe') {
  <circle cx="12" cy="12" r="9" />
  <ellipse cx="12" cy="12" rx="4" ry="9" />
  <line x1="3.2" y1="12" x2="20.8" y2="12" />
  }
  @case ('dice') {
  <!-- Sagoma Dado 3D Isometrico -->
  <path d="M12 2.5 L20.5 7 V17 L12 21.5 L3.5 17 V7 Z" />
  <path d="M12 12 V21.5 M12 12 L20.5 7 M12 12 L3.5 7" />

  <!-- Faccia Superiore (1 punto centrale) -->
  <circle cx="12" cy="7" r="1.2" fill="currentColor" stroke="none" />

  <!-- Faccia Sinistra (2 punti) -->
  <circle cx="7.5" cy="11" r="1" fill="currentColor" stroke="none" />
  <circle cx="8.5" cy="16" r="1" fill="currentColor" stroke="none" />

  <!-- Faccia Destra (3 punti) -->
  <circle cx="15" cy="10.5" r="1" fill="currentColor" stroke="none" />
  <circle cx="16.2" cy="14.2" r="1" fill="currentColor" stroke="none" />
  <circle cx="17.5" cy="18" r="1" fill="currentColor" stroke="none" />
  }
  @case ('check') {
  <polyline points="4,13 9,18 20,6" /> }
  @case ('x') {
  <line x1="6" y1="6" x2="18" y2="18" />
  <line x1="18" y1="6" x2="6" y2="18" /> }
  <!-- ================= NUOVE ICONE AGGIUNTE ================= -->

  <!-- FORZIERE (Tesoro) -->
  @case ('chest') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="10" width="20" height="11" rx="1.5" />
    <path d="M2 10a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4" />
    <path d="M12 13v3" />
    <circle cx="12" cy="14.5" r="1" fill="currentColor" />
    <path d="M6 10v11M18 10v11" />
  </svg>
  }

  <!-- SACCO DI MONETE (Mercante) -->
  @case ('scale') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Perno centrale -->
    <path d="M12 3v18" />
    <!-- Braccio della bilancia -->
    <path d="M3 7h18" />
    <!-- Piatto sinistro -->
    <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
    <!-- Piatto destro -->
    <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
    <!-- Base -->
    <path d="M7 21h10" />
  </svg>
  }

  <!-- SOLE / ALTARE (Santuario) -->
  @case ('sun') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4" />
    <path
      d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
  </svg>
  }

  <!-- TESCHIO (Trappola) -->
  @case ('skull') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="12" r="1" fill="currentColor" />
    <circle cx="15" cy="12" r="1" fill="currentColor" />
    <path d="M8 20v2h8v-2M12 16v1M18 11a6 6 0 0 0-12 0c0 3 1.5 5 2.5 6.5h7c1-1.5 2.5-3.5 2.5-6.5z" />
  </svg>
  }

  <!-- SPADE INCROCIATE (Combattimento/Mostro) -->
  @case ('swords') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 17.5L3 6V3h3l11.5 11.5m-3-11.5L21 3v3l-11.5 11.5M4 17l3 3M17 4l3 3M3 21l3-3m12 3l-3-3" />
  </svg>
  }

  <!-- MARTELLO (Forgia/Upgrade) -->
  @case ('hammer') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 12l-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9" />
    <path d="M17.64 15L22 10.64" />
    <path d="M20.91 11.7l-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16 4.6V3.86c0-.85-.33-1.65-.93-2.25l-1.25-1.25" />
    <path d="M10.36 8.36l4.28 4.28" />
  </svg>
  }

  <!-- PUGNALE (Ladro) -->
  @case ('dagger') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2l3 5-3 11-3-11 3-5z" />
    <path d="M8 18h8" />
    <path d="M12 18v4" />
  </svg>
  }

  <!-- BASTONE (Mago) -->
  @case ('staff') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 19l14-14" />
    <circle cx="19" cy="5" r="2" />
  </svg>
  }

  <!-- PUGNO (Forza) -->
  @case ('fist') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 11V5a2 2 0 0 1 4 0v6" />
    <path d="M15 11V3a2 2 0 0 1 4 0v11a7 7 0 0 1-7 7H9a7 7 0 0 1-7-7v-3a2 2 0 0 1 4 0v2" />
  </svg>
  }

  <!-- PIUMA (Destrezza) -->
  @case ('feather') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L3 13v5h5l9.24-9.26z" />
    <line x1="16" y1="8" x2="2" y2="22" />
  </svg>
  }

  <!-- LIBRO (Intelligenza) -->
  @case ('book') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
  </svg>
  }
  <!-- ASCIA DA BATTAGLIA (Guerriero) -->
  @case ('axe') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9" />
    <path d="M15 13 9 7l4-4 6 6h3a8 8 0 0 1-7 7z" />
  </svg>
  }
  <!-- MUSCOLO / FORZA (STR) -->
  @case ('muscle') {
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6.5 6.5 11 11" />
    <path d="m21 21-1-1" />
    <path d="m3 3-1-1" />
    <path d="m18 22 4-4" />
    <path d="m2 6 4-4" />
    <path d="m3 10 7-7" />
    <path d="m14 21 7-7" />
  </svg>
  }
  @default {
  <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none" /> }
  }
</svg>
