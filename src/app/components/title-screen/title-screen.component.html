<div class="title-wrap">
  <!-- SIGILLO CENTRALE ARALDICO -->
  <div class="title-emblem">
    <div class="emblem-halo"></div>
    <div class="sigil sigil--lg title-sigil">
      <app-icon name="dice" [size]="44"></app-icon>
    </div>
  </div>

  <h1>{{ i18n.t('ui.title') }}</h1>
  <div class="title-sub">{{ i18n.t('ui.subtitle') }}</div>

  <div class="gothic-divider">
    <span class="divider-line"></span>
    <span class="divider-gem">✦</span>
    <span class="divider-line"></span>
  </div>

  <p class="lore">{{ i18n.t('ui.lore') }}</p>

  <div class="action-wrap">
    <button class="btn primary btn-descent" (click)="game.startCreateScreen()">
      <app-icon name="stairs" [size]="18"></app-icon>
      <span>{{ i18n.t('ui.startButton') }}</span>
      <app-icon name="arrow-right" [size]="16"></app-icon>
    </button>
  </div>

  @if (game.bestDepth() > 0) {
    <div class="record-plaque">
      <app-icon name="crown" [size]="16" class="crown-icon"></app-icon>
      <span>{{ i18n.tf('ui.bestDepthLabel', { depth: game.bestDepth() }) }}</span>
    </div>
  }
</div>
