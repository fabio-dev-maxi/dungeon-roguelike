<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>D&D 3.5e - Spell Selector Modal & Lightning Storm</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e293b;
      font-family: 'Georgia', serif;
      touch-action: none;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .dnd-card {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #f59e0b;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 65%;
    }

    .dnd-title {
      font-weight: bold;
      color: #fbbf24;
      font-size: 15px;
      border-bottom: 1px solid #f59e0b;
      padding-bottom: 4px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .stat-line {
      display: flex;
      gap: 12px;
      font-family: sans-serif;
      font-size: 12px;
    }

    .stat-label {
      color: #94a3b8;
    }

    .stat-val {
      color: #ffffff;
      font-weight: bold;
    }

    /* FINESTRA MODALE SELEZIONE MAGIE */
    #spell-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      color: #f8fafc;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      max-width: 380px;
      width: 90%;
    }

    .modal-title {
      font-size: 18px;
      color: #fbbf24;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 18px;
      font-family: sans-serif;
    }

    .spell-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 10px 0;
      padding: 12px 16px;
      background: #334155;
      border: 1px solid #f59e0b;
      color: #f8fafc;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .spell-btn:hover {
      background: #f59e0b;
      color: #0f172a;
    }
  </style>
  <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/+esm"
            }
        }
    </script>
</head>

<body>

  <div id="hud">
    <div class="dnd-card">
      <div class="dnd-title">🧙‍♂️ D&D 3.5e - Selezione Incantesimi</div>
      <div id="status-text">Tocca il Mago Elfo e seleziona il Drago per aprire il Grimorio!</div>
    </div>
    <div class="dnd-card" id="unit-stats" style="display: none;">
      <div class="dnd-title" id="unit-name">Drago Rosso</div>
      <div class="stat-line">
        <span><span class="stat-label">CA:</span> <span class="stat-val" id="unit-ac">21</span></span>
        <span><span class="stat-label">PF:</span> <span class="stat-val" id="unit-hp">85/85</span></span>
        <span><span class="stat-label">Atk:</span> <span class="stat-val" id="unit-atk">+14</span></span>
      </div>
    </div>
  </div>

  <!-- MODALE GRIMORIO INCANTESIMI -->
  <div id="spell-modal">
    <div class="modal-card">
      <div class="modal-title">📖 Scegli l'Incantesimo</div>
      <div class="modal-desc">Seleziona la magia da canalizzare prima del tiro di dado:</div>

      <button class="spell-btn" id="btn-fireball">
        <span>🔥 Palla di Fuoco</span>
        <small style="font-size:10px; opacity: 0.8;">(Danni Fuoco Area)</small>
      </button>
      <button class="spell-btn" id="btn-lightning">
        <span>⚡ Tempesta di Fulmini</span>
        <small style="font-size:10px; opacity: 0.8;">(Fulmine Immediato)</small>
      </button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import RAPIER from '@dimforge/rapier3d-compat';

    async function initGame() {
      // 1. RAPIER PHYSICS (WASM)
      await RAPIER.init();
      const gravity = { x: 0.0, y: -9.81, z: 0.0 };
      const world = new RAPIER.World(gravity);

      // 2. SCENA E CAMERA
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x334155);

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 11, 13);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 3. ILLUMINAZIONE
      scene.add(new THREE.AmbientLight(0xffffff, 1.3));
      const sun = new THREE.DirectionalLight(0xffedd5, 1.4);
      sun.position.set(6, 14, 8);
      sun.castShadow = true;
      scene.add(sun);

      // 4. PAVIMENTO E SCACCHIERA
      const boardSize = 8;
      const tileSize = 1.2;
      const offset = (boardSize / 2) * tileSize - (tileSize / 2);
      const totalBoardWidth = boardSize * tileSize;

      const floorGeo = new THREE.BoxGeometry(totalBoardWidth, 0.2, totalBoardWidth);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.6 });
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.position.set(0, -0.1, 0);
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      const groundBodyDesc = RAPIER.RigidBodyDesc.fixed().setTranslation(0, -0.1, 0);
      const groundBody = world.createRigidBody(groundBodyDesc);
      world.createCollider(RAPIER.ColliderDesc.cuboid(totalBoardWidth / 2, 0.1, totalBoardWidth / 2), groundBody);

      const tilesMap = new THREE.Group();
      scene.add(tilesMap);
      for (let x = 0; x < boardSize; x++) {
        for (let z = 0; z < boardSize; z++) {
          const tileGeo = new THREE.PlaneGeometry(tileSize * 0.95, tileSize * 0.95);
          tileGeo.rotateX(-Math.PI / 2);
          const isDark = (x + z) % 2 === 1;
          const tileMat = new THREE.MeshBasicMaterial({ color: isDark ? 0x334155 : 0x475569, transparent: true, opacity: 0.5 });
          const tile = new THREE.Mesh(tileGeo, tileMat);
          tile.position.set(x * tileSize - offset, 0.01, z * tileSize - offset);
          tile.userData = { isTile: true, gridX: x, gridZ: z };
          tilesMap.add(tile);
        }
      }

      function get3DPosition(gridX, gridZ) {
        return { x: gridX * tileSize - offset, z: gridZ * tileSize - offset };
      }

      // 5. CASSE FISICHE
      const dynamicPhysicsObjects = [];
      function spawnPhysicalCrate(gridX, gridZ, dropHeight = 2.5) {
        const pos = get3DPosition(gridX, gridZ);
        const size = 0.7;
        const crateGeo = new THREE.BoxGeometry(size, size, size);
        const crateMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.6 });
        const crateMesh = new THREE.Mesh(crateGeo, crateMat);
        crateMesh.castShadow = true; crateMesh.receiveShadow = true;
        scene.add(crateMesh);

        const bodyDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, dropHeight, pos.z);
        const body = world.createRigidBody(bodyDesc);
        const colliderDesc = RAPIER.ColliderDesc.cuboid(size / 2, size / 2, size / 2).setDensity(1.5).setRestitution(0.3);
        world.createCollider(colliderDesc, body);

        dynamicPhysicsObjects.push({ mesh: crateMesh, body, gridX, gridZ });
      }
      spawnPhysicalCrate(3, 1, 3.0);
      spawnPhysicalCrate(5, 2, 3.5);

      // 6. PERSONAGGI E BOSS DRAGO
      const units = [];

      function createHumanMesh(colorHex, isMage = false) {
        const group = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
        const bootMat = new THREE.MeshStandardMaterial({ color: 0x1e1b18 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.4, 0.06, 16), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
        base.position.y = 0.03; base.receiveShadow = true; group.add(base);

        const legGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.4, 10);
        const legL = new THREE.Mesh(legGeo, bootMat); legL.position.set(-0.1, 0.26, 0); legL.castShadow = true;
        const legR = new THREE.Mesh(legGeo, bootMat); legR.position.set(0.1, 0.26, 0); legR.castShadow = true;
        group.add(legL, legR);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.45, 0.22), armorMat);
        torso.position.y = 0.685; torso.castShadow = true; group.add(torso);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), skinMat);
        head.position.y = 1.05; head.castShadow = true; group.add(head);

        if (isMage) {
          const hat = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 12), armorMat);
          hat.position.y = 1.3; hat.castShadow = true; group.add(hat);
        }

        return { group, torsoMesh: torso };
      }

      function createDragonMesh() {
        const group = new THREE.Group();
        const redMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
        const darkRedMat = new THREE.MeshStandardMaterial({ color: 0x991b1b });

        const baseSize = tileSize * 2 - 0.1;
        const base = new THREE.Mesh(new THREE.BoxGeometry(baseSize, 0.06, baseSize), darkRedMat);
        base.position.y = 0.03; base.receiveShadow = true; group.add(base);

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.8, 1.5), redMat);
        body.position.y = 0.7; body.castShadow = true; group.add(body);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.8), darkRedMat);
        head.position.set(0, 1.5, -1.0); head.castShadow = true; group.add(head);

        return { group, torsoMesh: body };
      }

      function spawnUnit(gridX, gridZ, stats, isDragon = false) {
        const { group, torsoMesh } = isDragon ? createDragonMesh() : createHumanMesh(stats.color, stats.isMage);

        let occupiedTiles = [{ x: gridX, z: gridZ }];
        let posX = 0, posZ = 0;

        if (isDragon) {
          occupiedTiles = [
            { x: gridX, z: gridZ }, { x: gridX + 1, z: gridZ },
            { x: gridX, z: gridZ + 1 }, { x: gridX + 1, z: gridZ + 1 }
          ];
          const p1 = get3DPosition(gridX, gridZ);
          const p2 = get3DPosition(gridX + 1, gridZ + 1);
          posX = (p1.x + p2.x) / 2; posZ = (p1.z + p2.z) / 2;
        } else {
          const p = get3DPosition(gridX, gridZ);
          posX = p.x; posZ = p.z;
        }

        group.position.set(posX, 0.0, posZ);
        scene.add(group);

        const bodyDesc = RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(posX, 0.0, posZ);
        const body = world.createRigidBody(bodyDesc);
        const colSize = isDragon ? tileSize : 0.35;
        world.createCollider(RAPIER.ColliderDesc.cuboid(colSize, 0.5, colSize), body);

        const unitData = {
          root: group,
          body,
          torsoMesh,
          gridX, gridZ,
          occupiedTiles,
          originalColorHex: stats.color,
          stats: { ...stats, currentHp: stats.maxHp },
          isRagdoll: false
        };

        group.traverse(child => { if (child.isMesh) child.userData = { isPiece: true, unitData }; });
        units.push(unitData);
      }

      spawnUnit(1, 1, { name: "Paladino Umano", ca: 18, maxHp: 38, atkBonus: 8, dmgMin: 6, dmgMax: 14, speedMax: 3, color: 0xd97706, isEnemy: false });
      spawnUnit(2, 1, { name: "Mago Elfo", ca: 13, maxHp: 20, atkBonus: 6, dmgMin: 12, dmgMax: 28, speedMax: 3, color: 0x2563eb, isEnemy: false, isMage: true, isRanged: true });
      spawnUnit(4, 4, { name: "Drago Rosso (Grande)", ca: 21, maxHp: 85, atkBonus: 14, dmgMin: 8, dmgMax: 22, speedMax: 3, color: 0xdc2626, isEnemy: true }, true);

      function isCellOccupied(x, z) {
        const hasPiece = units.some(u => u.stats.currentHp > 0 && u.occupiedTiles.some(t => t.x === x && t.z === z));
        const hasCrate = dynamicPhysicsObjects.some(c => c.gridX === x && c.gridZ === z);
        return hasPiece || hasCrate;
      }

      function getDistanceBetweenUnits(unitA, unitB) {
        let minDist = Infinity;
        for (const tA of unitA.occupiedTiles) {
          for (const tB of unitB.occupiedTiles) {
            const dist = Math.max(Math.abs(tA.x - tB.x), Math.abs(tA.z - tB.z));
            if (dist < minDist) minDist = dist;
          }
        }
        return minDist;
      }

      // 7. HIGHLIGHTS OVERLAY
      const highlightGroup = new THREE.Group();
      scene.add(highlightGroup);
      const hlGeo = new THREE.PlaneGeometry(tileSize * 0.95, tileSize * 0.95);
      hlGeo.rotateX(-Math.PI / 2);
      const hlMoveMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.45 });
      const hlAtkMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.55 });

      function updateHighlights(selectedUnit) {
        clearHighlights();

        units.forEach(targetUnit => {
          if (targetUnit === selectedUnit || targetUnit.stats.currentHp <= 0) return;
          if (targetUnit.stats.isEnemy !== selectedUnit.stats.isEnemy) {
            const dist = getDistanceBetweenUnits(selectedUnit, targetUnit);
            if (dist === 1 || (selectedUnit.stats.isRanged && dist <= 6)) {
              targetUnit.occupiedTiles.forEach(tile => {
                const hl = new THREE.Mesh(hlGeo, hlAtkMat);
                const pos = get3DPosition(tile.x, tile.z);
                hl.position.set(pos.x, 0.08, pos.z);
                hl.userData = { isHighlight: true, gridX: tile.x, gridZ: tile.z };
                highlightGroup.add(hl);
              });
            }
          }
        });

        const startX = selectedUnit.gridX;
        const startZ = selectedUnit.gridZ;

        for (let x = 0; x < boardSize; x++) {
          for (let z = 0; z < boardSize; z++) {
            const dist = Math.max(Math.abs(x - startX), Math.abs(z - startZ));
            if (dist > 0 && dist <= selectedUnit.stats.speedMax && !isCellOccupied(x, z)) {
              const hl = new THREE.Mesh(hlGeo, hlMoveMat);
              const pos = get3DPosition(x, z);
              hl.position.set(pos.x, 0.08, pos.z);
              hl.userData = { isHighlight: true, gridX: x, gridZ: z };
              highlightGroup.add(hl);
            }
          }
        }
      }

      function clearHighlights() {
        while (highlightGroup.children.length > 0) highlightGroup.remove(highlightGroup.children[0]);
      }

      // 8. DADO d20 NUMERATO
      function createNumberTexture(num) {
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');

        ctx.font = 'bold 60px "Georgia", serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000'; ctx.lineWidth = 10;
        ctx.strokeText(num.toString(), 64, 64);
        ctx.fillStyle = '#fef08a';
        ctx.fillText(num.toString(), 64, 64);

        if (num === 6 || num === 9) {
          ctx.beginPath();
          ctx.moveTo(44, 98); ctx.lineTo(84, 98);
          ctx.lineWidth = 6; ctx.strokeStyle = '#fef08a';
          ctx.stroke();
        }

        return new THREE.CanvasTexture(canvas);
      }

      function createD20Mesh() {
        const rawGeo = new THREE.IcosahedronGeometry(0.38, 0);
        const geo = rawGeo.toNonIndexed();
        const mat = new THREE.MeshStandardMaterial({
          color: 0x581c87, roughness: 0.25, metalness: 0.5, flatShading: true
        });

        const d20Mesh = new THREE.Mesh(geo, mat);
        d20Mesh.castShadow = true;

        const posAttr = geo.attributes.position;
        const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
        const centroid = new THREE.Vector3(), normal = new THREE.Vector3();
        const cb = new THREE.Vector3(), ab = new THREE.Vector3();

        const d20Numbers = [20, 1, 19, 2, 18, 3, 17, 4, 16, 5, 15, 6, 14, 7, 13, 8, 12, 9, 11, 10];

        for (let i = 0; i < 20; i++) {
          vA.fromBufferAttribute(posAttr, i * 3 + 0);
          vB.fromBufferAttribute(posAttr, i * 3 + 1);
          vC.fromBufferAttribute(posAttr, i * 3 + 2);

          centroid.copy(vA).add(vB).add(vC).divideScalar(3);
          cb.subVectors(vC, vB); ab.subVectors(vA, vB);
          normal.crossVectors(cb, ab).normalize();

          const numTex = createNumberTexture(d20Numbers[i]);
          const numMat = new THREE.MeshBasicMaterial({ map: numTex, transparent: true, depthWrite: false });
          const numPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.24), numMat);
          numPlane.position.copy(centroid).addScaledVector(normal, 0.005);
          numPlane.lookAt(centroid.clone().add(normal));
          d20Mesh.add(numPlane);
        }

        return d20Mesh;
      }

      let d20RollState = null;

      function rollD20OnBoard(attacker, defender, chosenSpellType = 'melee') {
        const d20Mesh = createD20Mesh();
        const startX = attacker.root.position.x;
        const startZ = attacker.root.position.z;

        d20Mesh.position.set(startX, 2.8, startZ);
        scene.add(d20Mesh);

        const bodyDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(startX, 2.8, startZ);
        const body = world.createRigidBody(bodyDesc);
        const colDesc = RAPIER.ColliderDesc.ball(0.38).setRestitution(0.65).setDensity(2.0);
        world.createCollider(colDesc, body);

        body.setLinvel({ x: (Math.random() - 0.5) * 4, y: 3.5, z: (Math.random() - 0.5) * 4 }, true);
        body.setAngvel({ x: Math.random() * 25, y: Math.random() * 25, z: Math.random() * 25 }, true);

        const atkStats = attacker.stats;
        const defStats = defender.stats;
        const d20Roll = Math.floor(Math.random() * 20) + 1;
        const totalAtk = d20Roll + atkStats.atkBonus;
        const isHit = totalAtk >= defStats.ca || d20Roll === 20;

        d20RollState = {
          mesh: d20Mesh,
          body,
          phase: 'rolling',
          timer: 0,
          rollDuration: 2.0,
          pauseDuration: 1.5,
          attacker,
          defender,
          chosenSpellType,
          d20Roll,
          totalAtk,
          isHit
        };

        document.getElementById('status-text').innerHTML = `🎲 <b>LANCIO DEL d20 SULLA BOARD...</b>`;
      }

      // 9. ANIMAZIONI INCANTESIMI (PALLA DI FUOCO & TEMPESTA DI FULMINI)
      let fireballAnimState = null;
      let lightningAnimState = null;
      let activeExplosion = null;

      // A. Palla di Fuoco
      function castFireball(attacker, defender, isHit, d20Roll, totalAtk) {
        const fireballGroup = new THREE.Group();

        const coreGeo = new THREE.SphereGeometry(0.55, 24, 24);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const fireballMesh = new THREE.Mesh(coreGeo, coreMat);
        fireballGroup.add(fireballMesh);

        const auraGeo = new THREE.SphereGeometry(0.85, 24, 24);
        const auraMat = new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.45 });
        const auraMesh = new THREE.Mesh(auraGeo, auraMat);
        fireballGroup.add(auraMesh);

        const light = new THREE.PointLight(0xff4500, 8, 12);
        fireballGroup.add(light);

        const startPos = { x: attacker.root.position.x, y: 1.2, z: attacker.root.position.z };
        const targetPos = { x: defender.root.position.x, y: 1.2, z: defender.root.position.z };
        fireballGroup.position.set(startPos.x, startPos.y, startPos.z);

        scene.add(fireballGroup);

        fireballAnimState = {
          group: fireballGroup, attacker, defender, startPos, targetPos,
          progress: 0, isHit, d20Roll, totalAtk
        };

        document.getElementById('status-text').innerHTML = `🔥 <b>${attacker.stats.name}</b> lancia <span style="color:#f97316">PALLA DI FUOCO</span>!`;
      }

      // B. Tempesta di Fulmini (Nuovo Incantesimo)
      function castLightningStorm(attacker, defender, isHit, d20Roll, totalAtk) {
        const lightningGroup = new THREE.Group();
        const targetPos = defender.root.position;

        // Generazione 4 Fulmini Seghettati dall'alto (y = 9) verso il bersaglio
        const boltMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const flashLight = new THREE.PointLight(0x0284c7, 15, 14);
        flashLight.position.set(targetPos.x, 3.5, targetPos.z);
        lightningGroup.add(flashLight);

        for (let b = 0; b < 4; b++) {
          const boltPoints = [];
          let curX = targetPos.x + (Math.random() - 0.5) * 1.2;
          let curZ = targetPos.z + (Math.random() - 0.5) * 1.2;
          let curY = 9.0;

          boltPoints.push(new THREE.Vector3(curX, curY, curZ));

          while (curY > 0.2) {
            curY -= 0.8;
            curX += (Math.random() - 0.5) * 0.6;
            curZ += (Math.random() - 0.5) * 0.6;
            boltPoints.push(new THREE.Vector3(curX, curY, curZ));
          }

          const boltGeo = new THREE.BufferGeometry().setFromPoints(boltPoints);
          const boltLine = new THREE.Line(boltGeo, boltMat);
          lightningGroup.add(boltLine);
        }

        scene.add(lightningGroup);

        lightningAnimState = {
          group: lightningGroup, attacker, defender, targetPos,
          timer: 0, duration: 1.0, isHit, d20Roll, totalAtk
        };

        document.getElementById('status-text').innerHTML = `⚡ <b>${attacker.stats.name}</b> invoca <span style="color:#38bdf8">TEMPESTA DI FULMINI</span>!`;
      }

      function triggerExplosion(pos, isElectric = false) {
        const expGeo = new THREE.SphereGeometry(0.5, 24, 24);
        const expMat = new THREE.MeshBasicMaterial({
          color: isElectric ? 0x0284c7 : 0xff3300,
          transparent: true, opacity: 0.9
        });
        const expMesh = new THREE.Mesh(expGeo, expMat);
        expMesh.position.set(pos.x, pos.y, pos.z);

        const expLight = new THREE.PointLight(isElectric ? 0x38bdf8 : 0xff2200, 12, 15);
        expMesh.add(expLight);

        scene.add(expMesh);
        activeExplosion = { mesh: expMesh, scale: 0.5, opacity: 0.9 };
      }

      // 10. COMBATTIMENTO ED EFFETTI
      function applyAttackDamage(attacker, defender, isHit, d20Roll, totalAtk) {
        const atkStats = attacker.stats;
        const defStats = defender.stats;
        const statusText = document.getElementById('status-text');

        if (isHit) {
          const damage = Math.floor(Math.random() * (atkStats.dmgMax - atkStats.dmgMin + 1)) + atkStats.dmgMin;
          defStats.currentHp = Math.max(0, defStats.currentHp - damage);

          statusText.innerHTML = `🎲 Dado: <b>${d20Roll}</b> (+${atkStats.atkBonus}) = <b>${totalAtk}</b> vs CA ${defStats.ca} ➔ <span style="color:#4ade80">COLPITO!</span> (${damage} Danni 🔥⚡)`;

          if (defStats.currentHp <= 0 && !defender.isRagdoll) {
            defender.isRagdoll = true;
            world.removeRigidBody(defender.body);

            const pos = defender.root.position;
            const ragdollDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y + 0.2, pos.z);
            const ragdollBody = world.createRigidBody(ragdollDesc);
            world.createCollider(RAPIER.ColliderDesc.cuboid(0.3, 0.4, 0.3), ragdollBody);

            ragdollBody.applyImpulse({ x: (Math.random() - 0.5) * 8, y: 5.0, z: (Math.random() - 0.5) * 8 }, true);
            defender.body = ragdollBody;
            statusText.innerHTML += ` ➔ <b style="color:#ef4444">${defStats.name} spazzato via!</b>`;
          }
        } else {
          statusText.innerHTML = `🎲 Dado: <b>${d20Roll}</b> (+${atkStats.atkBonus}) = <b>${totalAtk}</b> vs CA ${defStats.ca} ➔ <span style="color:#f87171">MANCATO!</span>`;
        }
      }

      // 11. GESTIONE MODALE & INPUT
      let pendingAttack = null;
      const spellModal = document.getElementById('spell-modal');
      const btnFireball = document.getElementById('btn-fireball');
      const btnLightning = document.getElementById('btn-lightning');

      btnFireball.addEventListener('click', () => {
        if (!pendingAttack) return;
        spellModal.style.display = 'none';
        rollD20OnBoard(pendingAttack.attacker, pendingAttack.defender, 'fireball');
        pendingAttack = null;
      });

      btnLightning.addEventListener('click', () => {
        if (!pendingAttack) return;
        spellModal.style.display = 'none';
        rollD20OnBoard(pendingAttack.attacker, pendingAttack.defender, 'lightning');
        pendingAttack = null;
      });

      let movingUnit = null;
      let movePath = [];
      let currentPathIndex = 0;
      let stepProgress = 0;
      const stepSpeed = 3.5;

      function startChessMovement(unit, targetX, targetZ) {
        let currX = unit.gridX; let currZ = unit.gridZ;
        movePath = [];

        while (currX !== targetX || currZ !== targetZ) {
          if (currX < targetX) currX++; else if (currX > targetX) currX--;
          if (currZ < targetZ) currZ++; else if (currZ > targetZ) currZ--;
          movePath.push({ gridX: currX, gridZ: currZ, pos3D: get3DPosition(currX, currZ) });
        }

        movingUnit = unit; currentPathIndex = 0; stepProgress = 0;
        document.getElementById('status-text').innerText = "Spostamento in corso...";
      }

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let selectedUnit = null;

      window.addEventListener('pointerup', (e) => {
        if (movingUnit || fireballAnimState || lightningAnimState || d20RollState || spellModal.style.display === 'flex') return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(scene.children, true);
        let hitPiece = null; let hitTile = null;

        for (let i = 0; i < intersects.length; i++) {
          const obj = intersects[i].object;
          let curr = obj;
          while (curr && !curr.userData?.isPiece) { curr = curr.parent; }
          if (curr && curr.userData?.isPiece && !hitPiece) { hitPiece = curr.userData.unitData; }
          if ((obj.userData?.isTile || obj.userData?.isHighlight) && !hitTile) { hitTile = { x: obj.userData.gridX, z: obj.userData.gridZ }; }
        }

        // Clic su Unità
        if (hitPiece && hitPiece.stats.currentHp > 0) {
          if (selectedUnit && hitPiece !== selectedUnit) {
            const dist = getDistanceBetweenUnits(selectedUnit, hitPiece);

            // Mago Elfo Attacca a Distanza: APRI MODALE SCELTA MAGIE
            if (selectedUnit.stats.isRanged && dist > 1 && dist <= 6 && selectedUnit.stats.isEnemy !== hitPiece.stats.isEnemy) {
              pendingAttack = { attacker: selectedUnit, defender: hitPiece };
              spellModal.style.display = 'flex';
              deselectUnit();
              return;
            }

            // Attacco in Mischia Diretto
            if (dist === 1 && selectedUnit.stats.isEnemy !== hitPiece.stats.isEnemy) {
              rollD20OnBoard(selectedUnit, hitPiece, 'melee');
              deselectUnit();
              return;
            }
          }

          selectUnit(hitPiece);
          return;
        }

        // Clic su Casella per Muoversi
        if (selectedUnit && hitTile) {
          const targetX = hitTile.x; const targetZ = hitTile.z;
          const dist = Math.max(Math.abs(targetX - selectedUnit.gridX), Math.abs(targetZ - selectedUnit.gridZ));

          if (!isCellOccupied(targetX, targetZ) && dist <= selectedUnit.stats.speedMax) {
            startChessMovement(selectedUnit, targetX, targetZ);
          } else if (isCellOccupied(targetX, targetZ)) {
            document.getElementById('status-text').innerText = "Casella occupata o bloccata!";
          }
        }
      });

      function selectUnit(unit) {
        if (selectedUnit && selectedUnit !== unit) deselectUnit();
        selectedUnit = unit;
        selectedUnit.torsoMesh.material.color.setHex(0xfacc15);

        const stats = unit.stats;
        document.getElementById('unit-stats').style.display = 'block';
        document.getElementById('unit-name').innerText = stats.name;
        document.getElementById('unit-ac').innerText = stats.ca;
        document.getElementById('unit-hp').innerText = `${stats.currentHp}/${stats.maxHp}`;
        document.getElementById('unit-atk').innerText = `+${stats.atkBonus}`;

        document.getElementById('status-text').innerText = `${stats.name}: Tocca una casella verde o un nemico ROSSO.`;
        updateHighlights(unit);
      }

      function deselectUnit() {
        if (!selectedUnit) return;
        selectedUnit.torsoMesh.material.color.setHex(selectedUnit.originalColorHex);
        selectedUnit = null;
        clearHighlights();
        document.getElementById('unit-stats').style.display = 'none';
      }

      // 12. LOOP ANIMAZIONI
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        world.step();

        dynamicPhysicsObjects.forEach(obj => {
          const pos = obj.body.translation(); const rot = obj.body.rotation();
          obj.mesh.position.set(pos.x, pos.y, pos.z); obj.mesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);
        });

        // Fasi Dado d20
        if (d20RollState) {
          const st = d20RollState;
          st.timer += delta;

          if (st.phase === 'rolling') {
            const pos = st.body.translation(); const rot = st.body.rotation();
            st.mesh.position.set(pos.x, pos.y, pos.z); st.mesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);

            if (st.timer >= st.rollDuration) {
              st.phase = 'pause'; st.timer = 0;
              st.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
              st.body.setAngvel({ x: 0, y: 0, z: 0 }, true);

              const outcomeText = st.isHit ? '<span style="color:#4ade80">COLPITO!</span>' : '<span style="color:#f87171">MANCATO!</span>';
              document.getElementById('status-text').innerHTML = `🎲 Dado fermato su: <b>${st.d20Roll}</b> (+${st.attacker.stats.atkBonus}) = <b>${st.totalAtk}</b> vs CA ${st.defender.stats.ca} ➔ ${outcomeText}`;
            }
          } else if (st.phase === 'pause') {
            if (st.timer >= st.pauseDuration) {
              world.removeRigidBody(st.body);
              scene.remove(st.mesh);

              if (st.chosenSpellType === 'fireball') {
                castFireball(st.attacker, st.defender, st.isHit, st.d20Roll, st.totalAtk);
              } else if (st.chosenSpellType === 'lightning') {
                castLightningStorm(st.attacker, st.defender, st.isHit, st.d20Roll, st.totalAtk);
              } else {
                applyAttackDamage(st.attacker, st.defender, st.isHit, st.d20Roll, st.totalAtk);
              }
              d20RollState = null;
            }
          }
        }

        // Volo Palla di Fuoco
        if (fireballAnimState) {
          const st = fireballAnimState;
          st.progress += delta * 0.8;

          st.group.position.x = THREE.MathUtils.lerp(st.startPos.x, st.targetPos.x, Math.min(st.progress, 1));
          st.group.position.y = THREE.MathUtils.lerp(st.startPos.y, st.targetPos.y, Math.min(st.progress, 1)) + Math.sin(Math.min(st.progress, 1) * Math.PI) * 0.6;
          st.group.position.z = THREE.MathUtils.lerp(st.startPos.z, st.targetPos.z, Math.min(st.progress, 1));

          if (st.progress >= 1) {
            triggerExplosion(st.targetPos, false);
            applyAttackDamage(st.attacker, st.defender, st.isHit, st.d20Roll, st.totalAtk);
            scene.remove(st.group);
            fireballAnimState = null;
          }
        }

        // Tempesta di Fulmini
        if (lightningAnimState) {
          const st = lightningAnimState;
          st.timer += delta;

          // Flashing dei fulmini
          st.group.visible = Math.random() > 0.2;

          if (st.timer >= st.duration) {
            triggerExplosion(st.targetPos, true);
            applyAttackDamage(st.attacker, st.defender, st.isHit, st.d20Roll, st.totalAtk);
            scene.remove(st.group);
            lightningAnimState = null;
          }
        }

        // Esplosione Magica
        if (activeExplosion) {
          const exp = activeExplosion;
          exp.scale += delta * 10;
          exp.opacity -= delta * 1.5;

          exp.mesh.scale.set(exp.scale, exp.scale, exp.scale);
          exp.mesh.material.opacity = Math.max(0, exp.opacity);

          if (exp.opacity <= 0) {
            scene.remove(exp.mesh);
            activeExplosion = null;
          }
        }

        // Movimento passo-passo
        if (movingUnit && movePath.length > 0) {
          stepProgress += delta * stepSpeed;

          const currentStep = movePath[currentPathIndex];
          const startPos = currentPathIndex === 0
            ? get3DPosition(movingUnit.gridX, movingUnit.gridZ)
            : movePath[currentPathIndex - 1].pos3D;

          movingUnit.root.position.x = THREE.MathUtils.lerp(startPos.x, currentStep.pos3D.x, Math.min(stepProgress, 1));
          movingUnit.root.position.z = THREE.MathUtils.lerp(startPos.z, currentStep.pos3D.z, Math.min(stepProgress, 1));
          movingUnit.root.position.y = Math.sin(Math.min(stepProgress, 1) * Math.PI) * 0.2;

          if (stepProgress >= 1) {
            stepProgress = 0;
            movingUnit.gridX = currentStep.gridX;
            movingUnit.gridZ = currentStep.gridZ;
            movingUnit.occupiedTiles = [{ x: currentStep.gridX, z: currentStep.gridZ }];
            currentPathIndex++;

            if (currentPathIndex >= movePath.length) {
              movingUnit.root.position.y = 0;
              const finishedUnit = movingUnit;
              movingUnit = null;
              movePath = [];

              selectUnit(finishedUnit);
              document.getElementById('status-text').innerText = "Spostamento completato. Nuove caselle aggiornate!";
            }
          }
        }

        units.forEach(u => {
          if (u.isRagdoll) {
            const pos = u.body.translation(); const rot = u.body.rotation();
            u.root.position.set(pos.x, pos.y, pos.z); u.root.quaternion.set(rot.x, rot.y, rot.z, rot.w);
          } else {
            u.body.setNextKinematicTranslation(u.root.position);
          }
        });

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    }

    initGame();
  </script>
