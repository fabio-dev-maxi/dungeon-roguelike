name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main   # o master, dipende dal tuo repo

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build:prod --base-href=/dungeon-roguelike/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/guglia-cava-roguelike/browser
